<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>럭키 룰렛 배팅 게임</title>
    <style>
        body {
            background-color: #12121e;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #f39c12; margin-bottom: 5px; font-size: 26px; }
        #game-container {
            width: 650px;
            margin: 0 auto;
            background: #1f1f32;
            border: 4px solid #f39c12;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.3);
        }
        #status-bar {
            display: flex;
            justify-content: space-around;
            background: #2a2a40;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        /* 룰렛판 시각 디자인 */
        #roulette-wheel {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #e74c3c, #c0392b);
            border: 6px solid #f1c40f;
            border-radius: 50%;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.5s ease-out;
        }
        .spinning {
            animation: spin 0.1s infinite linear;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 배팅 선택 버튼 영역 */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin: 15px 0 8px 0;
            color: #bdc3c7;
            text-align: left;
        }
        .grid-numbers {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .bet-btn {
            background-color: #34495e;
            color: white;
            border: 2px solid #7f8c8d;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.1s;
        }
        .bet-btn:hover { background-color: #4e6882; border-color: #f39c12; }
        .bet-btn.selected { background-color: #d35400; border-color: #f1c40f; transform: scale(1.05); }

        .type-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        /* 컨트롤 영역 */
        #control-panel {
            margin-top: 20px;
            background: #2a2a40;
            padding: 12px;
            border-radius: 8px;
        }
        .action-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:hover { background-color: #2ecc71; }
        .action-btn:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        #log-box {
            margin-top: 15px;
            background: #12121e;
            border-radius: 8px;
            padding: 10px;
            height: 80px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            font-family: monospace;
            border: 1px solid #2a2a40;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>🎰 럭키 룰렛 배팅 게임 🎰</h1>
        
        <!-- 상태창 -->
        <div id="status-bar">
            <div>보유 칩 🟡 <span id="chips">100</span>개</div>
            <div>배팅 금액: <span id="current-bet-amount">10</span>개</div>
            <div>선택한 항목: <span id="current-choice" style="color: #f1c40f;">없음</span></div>
        </div>

        <!-- 룰렛 회전판 -->
        <div id="roulette-wheel">?</div>

        <!-- 배팅 금액 조절 -->
        <div style="margin-bottom: 10px;">
            배팅할 칩 조절: 
            <button class="bet-btn" style="padding: 5px 10px;" onclick="setBet(5)">5개</button>
            <button class="bet-btn" style="padding: 5px 10px;" onclick="setBet(10)">10개</button>
            <button class="bet-btn" style="padding: 5px 10px;" onclick="setBet(20)">20개</button>
            <button class="bet-btn" style="padding: 5px 10px;" onclick="setBet(50)">50개</button>
        </div>

        <hr style="border-color: #2a2a40;">

        <!-- 배팅 영역 선택 -->
        <div class="section-title">1️⃣ 숫자 배팅 (0 ~ 9) - 적중 시 9배 당첨!</div>
        <div class="grid-numbers" id="number-grid">
            <!-- 자바스크립트로 숫자 버튼 생성 -->
        </div>

        <div class="section-title">2️⃣ 홀짝 / 범위 배팅 - 적중 시 2배 당첨!</div>
        <div class="type-grid">
            <button class="bet-btn" onclick="selectBet('odd', '홀수 (배당 2배)')">홀수 (1,3,5,7,9)</button>
            <button class="bet-btn" onclick="selectBet('even', '짝수 (배당 2배)')">짝수 (0,2,4,6,8)</button>
            <button class="bet-btn" onclick="selectBet('low', '저번호 0~4 (배당 2배)')">저번호 (0 ~ 4)</button>
            <button class="bet-btn" onclick="selectBet('high', '고번호 5~9 (배당 2배)')">고번호 (5 ~ 9)</button>
        </div>

        <!-- 스핀 버튼 -->
        <div id="control-panel">
            <button id="spin-btn" class="action-btn" onclick="startSpin()" disabled>🎲 룰렛 돌리기 (배팅을 선택하세요)</button>
        </div>

        <!-- 로그 -->
        <div id="log-box" id="log-box">
            게임이 시작되었습니다! 원하시는 항목을 클릭해 배팅하고 룰렛을 돌려보세요.
        </div>
    </div>

    <script>
        let chips = 100;
        let betAmount = 10;
        let selectedType = null; // 'num', 'odd', 'even', 'low', 'high'
        let selectedValue = null; // 실제 선택된 값 (숫자 또는 문자열)

        // 숫자 버튼 생성 (0~9)
        const numGrid = document.getElementById("number-grid");
        for (let i = 0; i <= 9; i++) {
            let btn = document.createElement("button");
            btn.className = "bet-btn";
            btn.textContent = i;
            btn.id = `num-btn-${i}`;
            btn.onclick = () => selectBet('num', i, `숫자 ${i} (배당 9배)`);
            numGrid.appendChild(btn);
        }

        function setBet(amount) {
            if (amount > chips) {
                addLog("⚠️ 보유 칩보다 많은 금액을 배팅할 수 없습니다!");
                return;
            }
            betAmount = amount;
            document.getElementById("current-bet-amount").textContent = betAmount;
        }

        function selectBet(type, value, textName) {
            // 모든 버튼 선택 해제 스타일 적용
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));

            selectedType = type;
            selectedValue = value;

            if (type === 'num') {
                document.getElementById(`num-btn-${value}`).classList.add('selected');
                document.getElementById("current-choice").textContent = textName;
            } else {
                event.target.classList.add('selected');
                document.getElementById("current-choice").textContent = textName;
            }

            // 스핀 버튼 활성화
            let spinBtn = document.getElementById("spin-btn");
            spinBtn.disabled = false;
            spinBtn.textContent = "🎲 룰렛 돌리기!";
        }

        function addLog(text) {
            let logBox = document.getElementById("log-box");
            logBox.innerHTML += `<br>` + text;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function startSpin() {
            if (chips < betAmount) {
                addLog("💀 보유 칩이 부족합니다! 게임 오버 위험!");
                return;
            }

            // 칩 차감
            chips -= betAmount;
            document.getElementById("chips").textContent = chips;

            // 버튼 잠금
            document.getElementById("spin-btn").disabled = true;
            let wheel = document.getElementById("roulette-wheel");
            wheel.classList.add("spinning");
            wheel.textContent = "🌀";

            addLog(`🎯 [배팅 완료] ${betAmount}칩 투자됨. 룰렛이 회전합니다...`);

            setTimeout(() => {
                wheel.classList.remove("spinning");
                
                // 0~9 사이 랜덤 결과 당첨 번호 생성
                let winningNumber = Math.floor(Math.random() * 10);
                wheel.textContent = winningNumber;

                // 결과 판정
                let isWin = false;
                let reward = 0;

                if (selectedType === 'num') {
                    if (winningNumber === selectedValue) {
                        isWin = true;
                        reward = betAmount * 9; // 9배 적중
                    }
                } else if (selectedType === 'odd') {
                    if (winningNumber % 2 !== 0) { isWin = true; reward = betAmount * 2; }
                } else if (selectedType === 'even') {
                    if (winningNumber % 2 === 0) { isWin = true; reward = betAmount * 2; }
                } else if (selectedType === 'low') {
                    if (winningNumber >= 0 && winningNumber <= 4) { isWin = true; reward = betAmount * 2; }
                } else if (selectedType === 'high') {
                    if (winningNumber >= 5 && winningNumber <= 9) { isWin = true; reward = betAmount * 2; }
                }

                if (isWin) {
                    chips += reward;
                    addLog(`🎉 <b>[당첨!]</b> 당첨 번호: <b>${winningNumber}</b>! 축하합니다! +${reward}칩 획득!`);
                } else {
                    addLog(`❌ <b>[꽝]</b> 당첨 번호: <b>${winningNumber}</b>. 아쉽게도 빗나갔습니다.`);
                }

                document.getElementById("chips").textContent = chips;

                if (chips <= 0) {
                    addLog(`💀 칩을 모두 잃었습니다! 새로고침하여 다시 도전하세요.`);
                    document.getElementById("spin-btn").textContent = "게임 오버 (새로고침)";
                    return;
                }

                document.getElementById("spin-btn").disabled = false;
                document.getElementById("spin-btn").textContent = "🎲 다시 룰렛 돌리기";

            }, 1000); // 1초 뒤 결과 출력
        }
    </script>

</body>
</html>
