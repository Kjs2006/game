<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상인 키우기: 경제 트레이딩 게임</title>
    <style>
        body {
            background-color: #1b1b2f;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #e43f5a; margin-bottom: 10px; font-size: 24px; }
        #game-container {
            width: 650px;
            margin: 0 auto;
            background: #162447;
            border: 4px solid #1f4068;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }
        #status-bar {
            display: flex;
            justify-content: space-around;
            background: #1f4068;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .market-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .item-card {
            background: #0f3460;
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
        }
        .item-card h3 { margin: 0 0 10px 0; color: #ffeb3b; font-size: 18px; }
        .item-card p { margin: 6px 0; font-size: 15px; }
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 8px 14px;
            margin: 5px 3px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn:hover { background-color: #ff6b81; transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        
        #log-box {
            background: #0f3460;
            border-radius: 8px;
            padding: 12px;
            height: 110px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            font-family: monospace;
            border: 1px solid #1f4068;
            line-height: 1.4;
        }
        .next-btn-container {
            margin-top: 15px;
        }
        #btn-next-turn {
            background-color: #00b4d8;
            font-size: 18px;
            padding: 12px 30px;
        }
        #btn-next-turn:hover { background-color: #90e0ef; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>📈 상인 키우기: 트레이딩 타이쿤</h1>
        
        <!-- 상태창 -->
        <div id="status-bar">
            <div>자본금 🪙 <span id="money">100</span>원</div>
            <div>날짜 📅 <span id="turn">1</span>일차</div>
            <div>시세 변동까지: <span id="wait-count" style="color: #ffeb3b;">2</span>턴</div>
        </div>

        <!-- 마켓 아이템 목록 -->
        <div class="market-grid" id="market-grid">
            <!-- 동적 생성 -->
        </div>

        <div class="next-btn-container">
            <button id="btn-next-turn" class="btn" onclick="nextTurn()">다음 날로 진행 ⏭️</button>
        </div>

        <div style="margin-top: 15px; text-align: left; font-size: 14px; font-weight: bold;">📜 거래 일지 및 시장 소식</div>
        <div id="log-box">
            게임이 시작되었습니다! 자본금 100원으로 싸게 사서 비싸게 팔아보세요!<br>
            * 시세는 <b>정확히 2턴(날짜)이 지날 때마다</b> 무작위로 변경됩니다.
        </div>
    </div>

    <script>
        let money = 100;
        let turn = 1;
        let waitCount = 2; // 2턴마다 가격 변동

        // 아이템 정보 (이름, 현재가격, 보유수량, 가격하한선, 가격상한선)
        let items = [
            { id: 'apple', name: '🍎 사과', price: 15, stock: 0, min: 5, max: 35 },
            { id: 'iron', name: '⛏️ 철광석', price: 40, stock: 0, min: 20, max: 80 },
            { id: 'potion', name: '🧪 회복 포션', price: 70, stock: 0, min: 45, max: 130 },
            { id: 'gem', name: '💎 마법 보석', price: 150, stock: 0, min: 90, max: 280 }
        ];

        function updateUI() {
            document.getElementById("money").textContent = money;
            document.getElementById("turn").textContent = turn;
            document.getElementById("wait-count").textContent = waitCount;

            let grid = document.getElementById("market-grid");
            grid.innerHTML = "";

            items.forEach((item, index) => {
                let card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <h3>${item.name}</h3>
                    <p>시세: <b>${item.price}원</b></p>
                    <p>내 가방: <b style="color: #00ffcc;">${item.stock}개</b></p>
                    <div>
                        <button class="btn" onclick="buyItem(${index})">구매</button>
                        <button class="btn" onclick="sellItem(${index})">판매</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addLog(text) {
            let logBox = document.getElementById("log-box");
            logBox.innerHTML += `<br>` + text;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function buyItem(index) {
            let item = items[index];
            if (money >= item.price) {
                money -= item.price;
                item.stock++;
                addLog(`🛒 [구매] ${item.name}을(를) <b>${item.price}원</b>에 매수했습니다. (남은 자산: ${money}원)`);
                updateUI();
            } else {
                addLog(`⚠️ 자본금이 부족하여 ${item.name}을(를) 살 수 없습니다!`);
            }
        }

        function sellItem(index) {
            let item = items[index];
            if (item.stock > 0) {
                money += item.price;
                item.stock--;
                addLog(`💰 [판매] ${item.name}을(를) <b>${item.price}원</b>에 매도했습니다! (현재 자산: ${money}원)`);
                updateUI();
            } else {
                addLog(`⚠️ 가방에 보유 중인 ${item.name}이(가) 없습니다!`);
            }
        }

        function nextTurn() {
            turn++;
            waitCount--;

            if (waitCount <= 0) {
                // 정확히 2턴 경과 후 가격 변동 실행
                waitCount = 2; // 카운터 초기화
                addLog(`🔄 <b>[시세 변동 알림]</b> 시장 물가가 대변동하였습니다!`);

                items.forEach(item => {
                    let oldPrice = item.price;
                    // 최저~최고 가격 안에서 랜덤하게 새로운 가격 책정
                    let newPrice = Math.floor(Math.random() * (item.max - item.min + 1)) + item.min;
                    item.price = newPrice;
                    
                    let diff = newPrice - oldPrice;
                    let diffText = diff > 0 ? `<span style="color:#ff5252;">(+${diff}원 상승 📈)</span>` : (diff < 0 ? `<span style="color:#4cd137;">(${diff}원 하락 📉)</span>` : `(유지)`);
                    addLog(` &nbsp;&bull; ${item.name}: ${oldPrice}원 ➔ <b>${newPrice}원</b> ${diffText}`);
                });
            } else {
                addLog(`📅 ${turn}일차가 되었습니다. (다음 시세 변동까지 <b>${waitCount}턴</b> 남음)`);
            }

            updateUI();
        }

        // 초기 화면 표시
        updateUI();
    </script>

</body>
</html>
